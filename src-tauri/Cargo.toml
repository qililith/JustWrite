[package]
name = "justwrite"
version = "0.1.0"
description = "写文章（JustWrite）：本地优先的写作编辑器"
authors = ["qililith"]
license = ""
repository = "https://github.com/qililith/JustWrite"
edition = "2021"
rust-version = "1.80"

[lib]
name = "justwrite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
